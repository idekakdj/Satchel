<!DOCTYPE html>
<html lang="en">
<head>
  <script src="/js/tabs-bridge.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="referrer" content="no-referrer">
  <meta name="color-scheme" content="light dark">
  <title>Margin</title>
  <link rel="icon" href="/margin/img/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/app-kit.css">
  <link rel="stylesheet" href="/margin/css/margin.css">
  <script type="module" src="/margin/js/margin.js"></script>
</head>
<body class="margin">
  <div class="app">
    <header class="app-bar">
      <button type="button" class="icon-btn" id="sidebar-toggle" aria-label="Show or hide folders" aria-controls="sidebar" aria-expanded="true"></button>
      <span class="brand"><img src="/margin/img/icon.svg" alt="" width="28" height="28">Margin</span>
      <span class="spacer"></span>
      <span class="save-state" id="save-state" aria-live="polite"></span>
      <button type="button" class="btn btn-accent" id="new-note"></button>
    </header>
    <div class="workspace">
      <aside class="sidebar" id="sidebar" aria-label="Folders and notes">
        <div class="side-search">
          <input type="search" class="input" id="search" placeholder="Search notes" aria-label="Search notes" autocomplete="off">
        </div>
        <nav class="tree" id="tree" aria-label="Folders"></nav>
        <div class="side-foot">
          <button type="button" class="btn btn-sm" id="new-folder"></button>
        </div>
      </aside>
      <button type="button" class="scrim" id="scrim" aria-label="Close folders" hidden></button>
      <main class="editor" id="editor">
        <div class="empty-state" id="no-note">
          <h3>Pick a note, or start a new one</h3>
          <p>Folders live in the sidebar. Type with the keyboard or write with a pen.</p>
        </div>
        <div class="note" id="note" hidden>
          <div class="note-head">
            <input class="title-input serif" id="title" aria-label="Note title" maxlength="200" autocomplete="off">
            <div class="note-meta" id="note-meta"></div>
          </div>
          <div class="toolbar" id="toolbar" role="toolbar" aria-label="Writing tools"></div>
          <div class="paper-scroller" id="scroller">
            <div class="page lined" id="page">
              <textarea class="page-text" id="text" aria-label="Note text" spellcheck="true" placeholder="Start typing, or switch to the pen to write by hand…"></textarea>
            </div>
          </div>
          <canvas class="ink" id="ink" aria-hidden="true"></canvas>
          <canvas class="ink live" id="ink-live" aria-hidden="true"></canvas>
        </div>
      </main>
    </div>
  </div>
</body>
</html>
