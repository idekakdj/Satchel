<!DOCTYPE html>
<html lang="en" data-shell="1">
<head>
  <script src="/js/frame-escape.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="no-referrer">
  <meta name="color-scheme" content="light dark">
  <title>Satchel</title>
  <link rel="icon" href="/img/satchel.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/home.css">
  <script type="module" src="/js/home.js"></script>
</head>
<body>
  <aside class="sidebar" id="sidebar" aria-label="Satchel">
    <div class="sb-head">
      <div class="sb-brand">
        <img src="/img/satchel.svg" alt="" width="24" height="24">
        <span class="sb-label sb-brand-name">Satchel</span>
      </div>
      <button type="button" class="sb-close" id="sb-close" aria-label="Close menu" hidden>
        <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      </button>
      <button type="button" class="sb-toggle" id="sb-toggle" aria-label="Collapse sidebar" aria-expanded="true" aria-controls="sidebar">
        <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path class="sb-chevron" d="M10 3.5 5.5 8l4.5 4.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>
    <nav class="sb-nav" id="sb-nav" aria-label="Apps"></nav>
    <div class="sb-foot">
      <div class="user-menu" id="user-menu">
        <button type="button" class="user-btn" id="user-btn" aria-haspopup="menu" aria-expanded="false" aria-controls="user-pop" aria-label="Account menu">
          <span class="user-avatar" id="user-avatar" aria-hidden="true"></span>
          <span class="sb-label user-name" id="user-name"></span>
        </button>
        <div class="user-pop" id="user-pop" role="menu" aria-label="Account menu" hidden>
          <button type="button" role="menuitem" class="menu-item" id="settings-btn">Settings</button>
          <button type="button" role="menuitem" class="menu-item" id="signout-btn">Sign out</button>
        </div>
      </div>
    </div>
  </aside>
  <div class="sb-backdrop" id="sb-backdrop" hidden></div>

  <div class="main" id="main">
    <header class="mobilebar" id="mobilebar">
      <button type="button" class="icon-btn" id="menu-btn" aria-label="Open menu" aria-expanded="false" aria-controls="sidebar">
        <svg viewBox="0 0 16 16" width="18" height="18" aria-hidden="true"><path d="M2.5 4.5h11M2.5 8h11M2.5 11.5h11" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      </button>
      <span class="mobilebar-title" id="mobilebar-title">Satchel</span>
    </header>
    <main class="content" id="content">
      <section class="home-view" id="home-view" aria-label="Satchel home" tabindex="-1">
        <div class="home-inner">
          <h1 class="greeting" id="greeting">Welcome back</h1>
          <p class="greeting-sub" id="date-line"></p>
          <div id="sections"></div>
        </div>
      </section>
      <div class="frames" id="frames"></div>
    </main>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
  <noscript><p class="noscript">Satchel needs JavaScript to run.</p></noscript>
</body>
</html>
